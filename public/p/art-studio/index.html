<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Вход — пример сайта изостудии</title>
    <style>
      :root {
        --paper: #f7f3eb;
        --ink: #3a342c;
        --muted: #7a7268;
        --blue: #6b9bc2;
        --pink: #e07b86;
        --line: rgba(90, 83, 74, 0.2);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 50% 40% at 90% 10%, rgba(224, 123, 134, 0.18), transparent 60%),
          radial-gradient(ellipse 45% 35% at 10% 90%, rgba(107, 155, 194, 0.16), transparent 55%),
          var(--paper);
      }
      .card {
        width: min(100%, 22rem);
        background: #fffcf7;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.75rem 1.5rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
        font-weight: 700;
      }
      .brand { color: var(--blue); }
      .brand span { color: var(--pink); }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
      }
      input {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.65rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        background: #fff;
      }
      input:focus {
        outline: 2px solid color-mix(in srgb, var(--blue) 45%, transparent);
        border-color: var(--blue);
      }
      button {
        margin-top: 1rem;
        width: 100%;
        min-height: 2.85rem;
        border: 0;
        border-radius: 8px;
        background: var(--pink);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { filter: brightness(0.96); }
      button:disabled { opacity: 0.6; cursor: wait; }
      .error {
        margin-top: 0.85rem;
        color: #b33b3b;
        font-size: 0.88rem;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="brand">мама, <span>я рисую</span></h1>
      <p>Закрытый пример сайта. Введите пароль, который прислал разработчик.</p>
      <form id="gate" novalidate>
        <label for="password">Пароль</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        />
        <button type="submit">Открыть пример</button>
        <div class="error" id="error" role="alert" aria-live="polite"></div>
      </form>
    </main>
    <script>
      const form = document.getElementById("gate");
      const error = document.getElementById("error");
      const btn = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        btn.disabled = true;
        try {
          const password = new FormData(form).get("password");
          const res = await fetch("/api/preview/art-studio/unlock", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            error.textContent = data.message || "Неверный пароль";
            btn.disabled = false;
            return;
          }
          window.location.href = data.redirect || "/artStudio/";
        } catch {
          error.textContent = "Не удалось связаться с сервером";
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
