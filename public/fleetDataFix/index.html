<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet CLI data-fix — demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">Full-stack demo · /api/demos/once</p>
      <h1>CLI-таск: data-fix по парку отелей</h1>
      <p class="lead">
        Обход активного парка по <code>hotel_id</code>, чанки правок, dry-run / apply и resume с
        <code>--start_hotel_id</code> после сбоя. Не schema-миграция — контролируемый data fix.
        Синтетика в Postgres.
      </p>
    </header>

    <section class="stats" id="stats"></section>

    <section class="controls">
      <button id="reset" type="button">Reset seed</button>
      <button id="dry" type="button">Dry-run (+ fail)</button>
      <button id="apply" type="button" class="primary">Apply</button>
      <button id="resume" type="button">Resume last</button>
    </section>

    <section>
      <h2>Jobs</h2>
      <div id="jobs" class="jobs"></div>
    </section>

    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="./app.js" type="module"></script>
</body>
</html>
