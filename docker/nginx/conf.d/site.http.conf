upstream api {
    server api:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/contact {
        limit_req zone=contact_limit burst=3 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Art-studio — frozen (no Directus / preview gate while profile is off)
    location ^~ /p/art-studio/ {
        default_type text/plain;
        return 503 'Art studio preview is temporarily frozen.\n';
    }

    location ^~ /artStudio/ {
        default_type text/plain;
        return 503 'Art studio demo is temporarily frozen.\n';
    }

    location = /cms {
        return 302 /cms/;
    }

    location ^~ /cms/ {
        default_type text/plain;
        return 503 'Art studio CMS is temporarily frozen.\n';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
